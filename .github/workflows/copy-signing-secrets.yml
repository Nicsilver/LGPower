# One-off: copies this repo's Android signing secrets to the Flutter port's
# repo. Secrets are write-only through GitHub, so the values can only travel
# inside a workflow. Delete this file after it has run.
name: Copy signing secrets to LGPower-Flutter

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TEMP_COPY_TOKEN }}
    steps:
      - name: Copy secrets
        run: |
          printf '%s' "${{ secrets.KEYSTORE_PASSWORD }}" | gh secret set KEYSTORE_PASSWORD --repo Nicsilver/LGPower-Flutter
          printf '%s' "${{ secrets.KEY_PASSWORD }}" | gh secret set KEY_PASSWORD --repo Nicsilver/LGPower-Flutter
          printf '%s' "${{ secrets.KEY_ALIAS }}" | gh secret set KEY_ALIAS --repo Nicsilver/LGPower-Flutter
          gh secret list --repo Nicsilver/LGPower-Flutter
