# The plan's ~70-trial night (per app). Roughly 30 minutes unattended on the phone.
name: full
settings:
  gap_s: 1.5
rows:
  - {sc: tap, n: 10}
  - {sc: lock, lock_s: 8, n: 20}
  - {sc: lock, lock_s: 30, n: 5}
  - {sc: lock, lock_s: 180, n: 3}
  - {sc: bg, bg_s: 8, n: 10}
  - {sc: cold, n: 5}
  - {sc: hold, ms: 3000, n: 5}
  - {sc: fast, gap_ms: 110, taps: 10, n: 5}
  - {sc: fast, gap_ms: 70, taps: 10, n: 3}
  - {sc: drag, from: touchpad, ms: 300, n: 5}
  - {sc: locked_pad, ms: [300, 1500], n: 5}
  - {sc: idle_gap, s: 120, n: 2}
  # pad_click needs --allow-click on the real TV; wifi_blip only on an emulator or a USB-connected phone
  # - {sc: pad_click, n: 5}
  # - {sc: wifi_blip, off_s: 5, n: 3}
